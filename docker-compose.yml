services:
  crm-redis:
    image: redis:7-alpine
    container_name: crm-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - crm-redis-data:/data
    restart: unless-stopped

  crm-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crm-backend
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - crm-redis
    restart: unless-stopped

  crm-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_API_URL: ${VITE_APP_API_URL}
        VITE_APP_AUTH0_DOMAIN: ${VITE_APP_AUTH0_DOMAIN}
        VITE_APP_AUTH0_AUDIENCE: ${VITE_APP_AUTH0_AUDIENCE}
        VITE_APP_AUTH0_CLIENT_ID: ${VITE_APP_AUTH0_CLIENT_ID}
    container_name: crm-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - crm-backend
    restart: unless-stopped

  # Exposes crm-backend over HTTPS via a free Cloudflare quick tunnel — used
  # by the separate Vercel-hosted frontend deploy. No domain/cert setup
  # required, but the assigned https://*.trycloudflare.com url (see
  # `docker compose logs crm-tunnel`) changes every time this container
  # restarts, so it's not a stable long-term URL.
  crm-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: crm-tunnel
    command: tunnel --url http://crm-backend:5000
    depends_on:
      - crm-backend
    restart: unless-stopped

  # Public entrypoint for the VPS-hosted deploy (portal.datacircles.in) —
  # terminates TLS with an automatic, auto-renewing Let's Encrypt cert and
  # reverse-proxies to crm-frontend / crm-backend over the internal Docker
  # network. Needs DNS for the domain in the Caddyfile pointed at this
  # VPS's IP before Let's Encrypt's HTTP-01 challenge can succeed.
  caddy:
    image: caddy:2-alpine
    container_name: crm-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - crm-backend
      - crm-frontend
    restart: unless-stopped

volumes:
  crm-redis-data:
  caddy-data:
  caddy-config:
