services:
  crm-redis:
    image: redis:7-alpine
    container_name: crm-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - crm-redis-data:/data
    restart: unless-stopped

  crm-backend:
    build: ./backend
    container_name: crm-backend
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - crm-redis
    restart: unless-stopped

  crm-frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_API_URL: ${VITE_APP_API_URL}
        VITE_APP_AUTH0_DOMAIN: ${VITE_APP_AUTH0_DOMAIN}
        VITE_APP_AUTH0_AUDIENCE: ${VITE_APP_AUTH0_AUDIENCE}
        VITE_APP_AUTH0_CLIENT_ID: ${VITE_APP_AUTH0_CLIENT_ID}
    container_name: crm-frontend
    ports:
      - "3000:80"
    depends_on:
      - crm-backend
    restart: unless-stopped

volumes:
  crm-redis-data:
