<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Chrome's "Request Desktop Site" on phones keeps the physical CSS
      // viewport narrow (~980px) while spoofing a desktop-like UA, which
      // falls below our lg: (1024px) breakpoint used app-wide — so the
      // mobile layout kept showing even in that mode. When it's detected,
      // widen the viewport meta so the layout genuinely renders at desktop
      // width (browser handles zoom/scroll), letting our normal lg:
      // breakpoint kick in with no component changes needed.
      (function () {
        var isDesktopSiteRequest;
        if (navigator.userAgentData && "mobile" in navigator.userAgentData) {
          // Modern Chrome/Edge: explicitly reflects the "Desktop site" toggle.
          isDesktopSiteRequest = navigator.userAgentData.mobile === false && /Android|iPhone/i.test(navigator.userAgent);
        } else {
          // Fallback for browsers without userAgentData: a touch device whose
          // UA string no longer says "Mobile" is very likely in desktop-site mode.
          var ua = navigator.userAgent;
          var looksMobileDevice = /Android|iPhone|iPad|iPod/i.test(ua);
          var uaSaysMobile = /Mobile/i.test(ua);
          isDesktopSiteRequest = looksMobileDevice && !uaSaysMobile;
        }
        if (isDesktopSiteRequest) {
          document
            .querySelector('meta[name="viewport"]')
            .setAttribute("content", "width=1280");
        }
      })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <title>DataCircles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&family=Marck+Script&family=Meie+Script&family=Pacifico&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
